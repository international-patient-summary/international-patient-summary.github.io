name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One deploy at a time; let a running one finish rather than cancelling it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # The Lily packages declare "engines": { "node": "=26" }.
          node-version: 26
          cache: pnpm

      # The content is vendored into content/, so the build needs nothing
      # from the main repository.
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run check

      # https://svelte.dev/docs/kit/adapter-static#GitHub-Pages
      # BASE_PATH is deliberately left unset: this repository is named
      # <org>.github.io and is served from the domain root.
      - name: Build
        run: pnpm run build

      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
